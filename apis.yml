name: StatusPRO
description: 'StatusPRO is a sports technology and gaming company founded by former
  professional athletes, building extended reality (XR) products that pair competitive
  training tools for elite athletes with immersive gaming experiences for consumers.
  Its flagship product, NFL PRO ERA, is an officially NFL- and NFLPA-licensed virtual
  reality football game for Meta Quest headsets, and its StatusPRO Visualizer powers
  immersive broadcast perspectives used by ESPN on NFL Live. The company operates a
  live-services consumer game rather than a developer platform: it publishes no public
  API, developer portal, or API documentation. This profile is maintained in the API
  Evangelist network as a company record; it carries no API surface at this time.'
